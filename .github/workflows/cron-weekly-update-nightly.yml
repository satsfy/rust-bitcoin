# TEST STUB. Same permissions block as the PR, cargo steps replaced by an echo,
# to show create-pull-request works without id-token.
name: Update Nightly rustc
on:
  workflow_dispatch:
permissions: {}
jobs:
  format:
    name: Update nightly rustc
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fake nightly update
        run: |
          echo "nightly-2026-10-31" > ci-test/nightly
          echo "nightly_version=nightly-2026-10-31" >> "$GITHUB_ENV"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ci-test-7139
          author: Update Nightly Rustc Bot <bot@example.com>
          committer: Update Nightly Rustc Bot <bot@example.com>
          title: "ci-test: automated nightly update (${{ env.nightly_version }})"
          body: test run of the nightly update workflow without id-token
          commit-message: "ci-test: automated update to rustc ${{ env.nightly_version }}"
          branch: ci-test/weekly-nightly-update
