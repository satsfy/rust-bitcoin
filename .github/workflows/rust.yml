---   # rust-bitcoin CI: If you edit this file please update README.md
# DEMO BRANCH - CI stripped to the API job only so the labeller pipeline can
# be exercised quickly. The API job below is byte-for-byte the real one.
on:   # yamllint disable-line rule:truthy
  push:
    branches:
      - 0.32.xxx
  pull_request:

name: Continuous integration

permissions: {}

env:
  RBMT_LOG_LEVEL: "progress"

jobs:
  # On an API diff detection, a label is added to the pull request. This job
  # uploads an artifact flag which a job on the default branch (`master`) picks
  # up and does the labelling. This follows best security practices.
  # https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
  API:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # History required for API diff.
      - uses: ./.github/actions/setup-rbmt
      - name: "Run API check"
        id: api_check
        run: |
          set +e
          cargo rbmt api --baseline ${{ github.event.pull_request.base.sha || github.event.before }}
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: "Save API diff state"
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXIT_CODE: ${{ steps.api_check.outputs.exit_code }}
        run: |
          echo "$PR_NUMBER" > api-diff
          echo "$EXIT_CODE" >> api-diff
      - name: "Upload API diff state"
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-diff
          path: api-diff
