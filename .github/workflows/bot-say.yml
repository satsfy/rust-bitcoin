name: Bot say
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
      body:
        required: true
permissions: {}
jobs:
  say:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          BODY: ${{ inputs.body }}
        run: gh pr comment "$PR" --body "$BODY"
