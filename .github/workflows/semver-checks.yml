# TEST STUB. Stands in for the real semver check producer: uploads whatever
# the PR branch put in ci-test/payload as the semver-break artifact, exactly
# like an attacker-controlled PR run could.
on:   # yamllint disable-line rule:truthy
  pull_request:
name: Check semver breaks
permissions: {}
jobs:
  Semver:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Produce artifact from PR controlled file"
        run: |
          cp ci-test/payload semver-break
          echo "artifact content:"; cat semver-break
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semver-break
          path: semver-break
