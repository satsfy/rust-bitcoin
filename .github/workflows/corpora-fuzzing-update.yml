# Fuzz every target seeded with the corpora stored in <owner>/qa-assets,
# minimize, and push the refreshed corpora back to qa-assets.
#
# Corpus files are written by libFuzzer and named by the SHA-1 of their
# contents, so runs only ever add or remove whole files and diffs stay clean.
#
# Pushing to qa-assets needs a cross-repo token, the default GITHUB_TOKEN is
# scoped to this repo. Add a fine-grained PAT with contents read and write on
# the qa-assets repo as the QA_ASSETS_PUSH_TOKEN actions secret. If the run
# produced corpus changes and the secret is missing the merge job fails,
# a green run must mean the corpora were persisted.
name: Update fuzz corpora

on:
  schedule:
    # Hourly runs, each taking about 45 minutes.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'rust-bitcoin repository to fuzz (defaults to this repository)'
        required: false
        default: ''
      source_ref:
        description: 'Branch, tag or commit to fuzz'
        required: false
        default: 'master'
      max_total_time:
        description: 'Seconds of fuzzing per target'
        required: false
        default: '1'

permissions: {}

# Never let two runs race on the final push.
concurrency:
  group: update-corpora
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ inputs.source_repo || github.repository }}
  SOURCE_REF: ${{ inputs.source_ref || 'master' }}
  MAX_TOTAL_TIME: ${{ inputs.max_total_time || '300' }}

jobs:
  # Resolve the source revision and enumerate fuzz targets so the matrix
  # never goes stale when targets are added or removed upstream.
  setup:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
      source_sha: ${{ steps.list.outputs.source_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - name: List fuzz targets
        id: list
        run: |
          export LC_ALL=C
          cd fuzz
          # Same transformation as fuzz/fuzz-util.sh targetFileToName. Sort
          # after the rename so the order matches `cargo fuzz list`.
          find fuzz_targets/ -type f -name '*.rs' \
            | sed 's/^fuzz_targets\///; s/\.rs$//; s/\//_/g; s/^_//' \
            | sort > "$RUNNER_TEMP/targets.txt"
          echo "targets=$(jq -R . < "$RUNNER_TEMP/targets.txt" | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fuzz_target: ${{ fromJSON(needs.setup.outputs.targets) }}
    env:
      TARGET: ${{ matrix.fuzz_target }}
    steps:
      # The corpora store, provides fuzz_corpora/ for seeding.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository_owner }}/qa-assets
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.setup.outputs.source_sha }}
          path: rust-bitcoin
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6
        with:
          toolchain: nightly
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin
            rust-bitcoin/fuzz/target
            rust-bitcoin/target
          key: fuzz-${{ matrix.fuzz_target }}-${{ hashFiles('rust-bitcoin/**/Cargo.toml') }}
          restore-keys: fuzz-${{ matrix.fuzz_target }}-
      # Build cargo-fuzz with stable. Its locked rustix dependency enables
      # rustc-internal attributes when it detects a nightly compiler and no
      # longer builds there.
      - name: Install cargo-fuzz
        run: |
          if ! cargo fuzz --version 2>/dev/null | grep -q '0\.12\.0'; then
            rustup toolchain install stable --profile minimal --no-self-update
            cargo +stable install --force --locked --version 0.12.0 cargo-fuzz
          fi
      # Same fuzz stub selection as rust-bitcoin's fuzz.sh, everything gets
      # the weak-crypto cfgs except the hashes targets which fuzz the real
      # implementations. The corpora must be generated and replayed under
      # the same cfgs.
      - name: Set RUSTFLAGS
        if: ${{ !startsWith(matrix.fuzz_target, 'hashes_') }}
        run: echo "RUSTFLAGS=--cfg=hashes_fuzz --cfg=secp256k1_fuzz" >> "$GITHUB_ENV"
      - name: Seed corpus
        run: |
          mkdir -p "rust-bitcoin/fuzz/corpus/$TARGET"
          if [ -d "fuzz_corpora/$TARGET" ]; then
            find "fuzz_corpora/$TARGET" -maxdepth 1 -type f \
              -exec cp -t "rust-bitcoin/fuzz/corpus/$TARGET/" {} +
          fi
      - name: Fuzz
        working-directory: rust-bitcoin
        run: cargo +nightly fuzz run "$TARGET" -- -max_total_time="$MAX_TOTAL_TIME"
      - name: Minimize corpus
        working-directory: rust-bitcoin
        run: cargo +nightly fuzz cmin "$TARGET"
      # Only reached when fuzzing found no crash, so crashing inputs never
      # land in fuzz_corpora.
      - name: Upload corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-${{ matrix.fuzz_target }}
          path: rust-bitcoin/fuzz/corpus/${{ matrix.fuzz_target }}
          if-no-files-found: warn
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-${{ matrix.fuzz_target }}
          path: rust-bitcoin/fuzz/artifacts/${{ matrix.fuzz_target }}
          if-no-files-found: ignore

  # Merge the per-target corpora and push. Runs even when some fuzz jobs
  # failed so that clean targets still get their update; failed targets keep
  # their previous corpus.
  merge:
    needs: [setup, fuzz]
    # even if a particular shard fails, run on successful shards, except if the workflow is cancelled
    if: ${{ always() && needs.setup.result == 'success' && needs.fuzz.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The corpora store. The PAT is needed for the push at the end, the
      # fallback token can only read.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository_owner }}/qa-assets
          token: ${{ secrets.QA_ASSETS_PUSH_TOKEN || github.token }}
          persist-credentials: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          pattern: corpus-*
          path: incoming
      - name: Refresh corpora
        env:
          TARGETS: ${{ needs.setup.outputs.targets }}
        run: |
          export LC_ALL=C
          mkdir -p fuzz_corpora incoming
          for dir in incoming/corpus-*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            name=${name#corpus-}
            rm -rf "fuzz_corpora/$name"
            mkdir -p "fuzz_corpora/$name"
            find "$dir" -maxdepth 1 -type f -exec cp -t "fuzz_corpora/$name/" {} +
          done
          # Drop corpora of targets that no longer exist upstream.
          echo "$TARGETS" | jq -r '.[]' > "$RUNNER_TEMP/targets.txt"
          for dir in fuzz_corpora/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            grep -qx "$name" "$RUNNER_TEMP/targets.txt" || rm -rf "$dir"
          done
      - name: Commit and push
        env:
          QA_TOKEN: ${{ secrets.QA_ASSETS_PUSH_TOKEN }}
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: main
        run: |
          git add -A fuzz_corpora
          if git diff --cached --quiet; then
            echo "No corpus changes"
            exit 0
          fi
          if [ -z "$QA_TOKEN" ]; then
            echo "::error::QA_ASSETS_PUSH_TOKEN is not set, refusing to drop the corpus updates"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update fuzz corpora" \
            -m "Source: $SOURCE_REPO@$SOURCE_SHA" \
            -m "Run: $RUN_URL"
          for _ in 1 2 3; do
            git push origin "HEAD:$BRANCH" && exit 0
            git pull --rebase origin "$BRANCH"
          done
          exit 1

  # Open an issue when the run found failures, close it when green again.
  # Same lifecycle and first line as ci-failure-issues.yml, plus the failed
  # targets, their logs and the crashing input artifacts, so nobody has to
  # click through the matrix by hand. continue-on-error so a reporting
  # problem never flips the run's own result.
  report:
    needs: [setup, fuzz, merge]
    if: ${{ always() && needs.setup.result == 'success' && needs.fuzz.result != 'cancelled' && needs.merge.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      issues: write
      actions: read
    env:
      FUZZ_RESULT: ${{ needs.fuzz.result }}
      MERGE_RESULT: ${{ needs.merge.result }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = "<!-- ci-failure-key:corpora-fuzz -->";
            const workflowUrl = `${context.serverUrl}/${owner}/${repo}/actions/workflows/corpora-fuzzing-update.yml`;
            const maxListed = 20;
            const failed = process.env.FUZZ_RESULT === "failure" || process.env.MERGE_RESULT === "failure";

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: context.runId,
            });

            const formatTs = iso => {
              const d = new Date(iso);
              const pad = n => String(n).padStart(2, "0");
              return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} at ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} UTC`;
            };
            const shortSha = sha => (sha || "unknown").slice(0, 7);
            const commitUrl = sha => `${context.serverUrl}/${owner}/${repo}/commit/${sha}`;

            // Dig out what actually failed so nobody has to open the run
            // and click through 100 jobs by hand.
            async function failureDetails() {
              try {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner,
                  repo,
                  run_id: context.runId,
                  filter: "latest",
                  per_page: 100,
                });
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  owner,
                  repo,
                  run_id: context.runId,
                  per_page: 100,
                });
                const crashFor = name => artifacts.find(a => a.name === `crash-${name}`);
                const artifactUrl = a => `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}/artifacts/${a.id}`;

                const fuzzFailed = [];
                const otherFailed = [];
                for (const j of jobs) {
                  if (j.conclusion !== "failure") continue;
                  const m = j.name.match(/^fuzz \((.+)\)$/);
                  if (m) {
                    fuzzFailed.push({ target: m[1], url: j.html_url });
                  } else {
                    otherFailed.push({ name: j.name, url: j.html_url });
                  }
                }

                const lines = [];
                if (fuzzFailed.length > 0) {
                  lines.push("", `Failed fuzz targets (${fuzzFailed.length}):`, "");
                  for (const f of fuzzFailed.slice(0, maxListed)) {
                    const crash = crashFor(f.target);
                    const crashPart = crash
                      ? ` - [crashing input](${artifactUrl(crash)})`
                      : "";
                    lines.push(`- [\`${f.target}\`](${f.url})${crashPart}`);
                  }
                  if (fuzzFailed.length > maxListed) {
                    lines.push(`- and ${fuzzFailed.length - maxListed} more, see the run`);
                  }
                  lines.push(
                    "",
                    "To reproduce, download the crashing input and run",
                    "",
                    "```",
                    "cargo +nightly fuzz run <target> <input-file>",
                    "```",
                    "",
                    "Targets not prefixed `hashes_` are built with `RUSTFLAGS='--cfg=hashes_fuzz --cfg=secp256k1_fuzz'`.",
                  );
                }
                if (otherFailed.length > 0) {
                  lines.push("", "Other failed jobs, infrastructure rather than a crash:", "");
                  for (const j of otherFailed) {
                    lines.push(`- [\`${j.name}\`](${j.url})`);
                  }
                }
                return lines;
              } catch (e) {
                core.warning(`Could not list jobs or artifacts: ${e.message}`);
                return ["", "See the run for the failing jobs."];
              }
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const existing = issues.find(issue =>
              !issue.pull_request && issue.body && issue.body.includes(marker)
            );

            if (failed && !existing) {
              const details = await failureDetails();
              await github.rest.issues.create({
                owner,
                repo,
                title: "The corpora fuzz workflow is failing",
                body: [
                  marker,
                  "",
                  `The [corpora fuzz workflow](${workflowUrl}) started failing on ${formatTs(run.created_at)}: [${run.name} #${run.run_number}](${run.html_url}) - [\`${shortSha(run.head_sha)}\`](${commitUrl(run.head_sha)})`,
                  ...details,
                ].join("\n"),
              });
            }

            if (!failed && existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `The [corpora fuzz workflow](${workflowUrl}) successfully ran again on ${formatTs(run.created_at)}: [${run.name} #${run.run_number}](${run.html_url}).`,
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
