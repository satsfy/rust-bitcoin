# TEST STUB. Named Miri so it feeds the CI Failure Issues workflow.
name: Miri
on:
  workflow_dispatch:
    inputs:
      result:
        description: "success or failure"
        required: true
        default: failure
permissions: {}
jobs:
  miri:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "requested result: ${{ inputs.result }}"
          test "${{ inputs.result }}" = "success"
